# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
enable_free_tier: true
tone_instructions: "Be concise, friendly, and constructive. Explain the why behind a suggestion. Don't nitpick style the linters already cover."

reviews:
  profile: chill                 # low-noise; switch to "assertive" for stricter first-pass linting
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  assess_linked_issues: true     # the PR template mandates a linked issue; assess the PR against it
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_usernames: []
    ignore_title_keywords:
      - "release-please"           # changelog PRs carry no code to review
      - "chore(main): release"

  # Exclude only TRACKED paths that shouldn't be reviewed. Build output, decompiled/,
  # node_modules/, dist/, TestResults/, and mock-data.json are already gitignored, so
  # they never enter a diff — no filter needed. These are the tracked-but-noise paths:
  path_filters:
    - "!docker/modern/**"          # out-of-scope Alpine/musl variant (tracked; see renovate ignorePaths)
    - "!sub_modules/**"            # git submodules (vendored external repos)
    - "!**/*.lock"                 # bun.lock x3 (machine-generated)
    - "!package-lock.json"         # npm lockfile (machine-generated)

  # Repo invariants, so the reviewer doesn't flag correct code.
  path_instructions:
    - path: "tests/JunimoServer.Tests/**"
      instructions: >-
        E2E tests use xUnit v3 with IPC. Never suggest Console.WriteLine or any stdout writes in test
        assemblies — it corrupts xUnit v3 discovery. Output goes through ITestOutputHelper or IMessageSink.
        Most tests are E2E (Testcontainers). A small in-process layer also exists for pure
        infrastructure logic (e.g. ExclusiveGateOwnershipTests, TransportFaultClassifierTests);
        don't flag those as forbidden unit tests.
    - path: "tests/test-client/**"
      instructions: >-
        This is a SMAPI mod (net6.0) driving the E2E test client. Game/SMAPI identifiers
        (StardewValley.*, StardewModdingAPI.*, Netcode.*, xTile.*) resolve against the game's assemblies
        and the gitignored decompiled/ reference tree — don't flag them as unknown or nonexistent.
    - path: "mod/**"
      instructions: >-
        The SMAPI mod targets net6.0 to match the game's bundled runtime. Don't suggest newer .NET / C#
        APIs or package upgrades — several deps are intentionally pinned (see renovate.json). NetDictionary
        MUTATIONS must use its public API (Remove/Add/indexer), not FieldDict.Remove/Add/Clear, or peer
        replication breaks; reads via FieldDict (ContainsKey, TryGetValue, iteration) are fine. GamePath
        comes from .env via Directory.Build.props — don't hardcode a game path in a .csproj.
        Game/SMAPI identifiers (StardewValley.*, StardewModdingAPI.*, Netcode.*, xTile.*) resolve against
        the game's assemblies and the gitignored decompiled/ reference tree — don't flag them as unknown
        or nonexistent.
    - path: "renovate.json"
      instructions: >-
        Version pins and caps (allowedVersions =X.Y.Z / <X.0.0 with versioning:semver) are deliberate
        compatibility constraints, each documented in its rule description. Don't suggest loosening them.
    - path: "**/*.csproj"
      instructions: >-
        Dependency bumps (often from Renovate): check the new version's release notes for breaking changes
        and flag any that hit how this repo uses the package — removed/renamed APIs, changed defaults,
        behavioral shifts, raised transitive framework requirements. Some versions are intentionally pinned
        for net6.0/runtime compatibility; cross-check renovate.json and don't suggest lifting a documented pin.
    - path: "**/package.json"
      instructions: >-
        Dependency bumps (often from Renovate): check the new version for breaking changes against how the
        repo uses the package — removed/renamed exports, changed APIs or defaults, peer-dependency or Node
        version requirements. Call out majors that need code changes in test-ui/docs/discord-bot.
    - path: ".github/workflows/**"
      instructions: >-
        validate-pr.yml is the single PR validation pipeline; keep its commitlint job and path filters coherent.
        Fork PRs are gated behind an authorize job — preserve that boundary for any secret-using step.
        For action-version bumps (often from Renovate), flag major bumps with breaking input/output or
        runtime changes that affect these workflows.
    - path: "docker/**"
      instructions: >-
        For base-image / tool-version bumps (often from Renovate), flag breaking changes — the test-client
        mod-builder stage must stay on .NET 6 to match the game runtime. The Dockerfile is multi-stage;
        keep the stage boundaries and secret mounts (not ENV) for Steam credentials intact.
    - path: ".claude/**"
      instructions: >-
        Rules and plans cite game symbols and decompiled/sdv-*/ file:line references. That reference tree
        is gitignored, so citations into it cannot be verified from the repo — don't flag cited game
        identifiers, methods, or decompiled/ paths as nonexistent or fabricated.

  # Governance rules as config-as-code (warning mode: visible, non-blocking). Distilled from
  # CLAUDE.md Prohibitions and .claude/rules/ — the rule files carry the full incident context.
  pre_merge_checks:
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "No stdout or LogLevel.Error test poison"
        mode: warning
        instructions: >-
          In test assemblies (tests/JunimoServer.Tests), flag any added Console.Write/WriteLine or
          other stdout writes — they corrupt xUnit v3's IPC and break test discovery. In mod code
          (mod/**, tests/test-client/**), flag logging at LogLevel.Error or new log lines matching
          "ERROR"/"FATAL" — the server-side log scan cancels E2E test runs on those; Warn or Trace
          are the alternatives.
      - name: "NetDictionary mutations via public API"
        mode: warning
        instructions: >-
          In mod/JunimoServer, flag mutations through NetDictionary.FieldDict (Remove/Add/Clear) —
          they break peer replication. Mutations must use the public API (Remove/Add/indexer).
          Reads via FieldDict (ContainsKey, TryGetValue, iteration) are fine.
      - name: "Host handlers on the right tick event"
        mode: warning
        instructions: >-
          In mod/JunimoServer, flag new latency-sensitive or sequential host-automation logic
          subscribed to OneSecondUpdateTicked — it fires every 60 game ticks (~12 s at the test
          SERVER_TPS=5). Such handlers belong in OnUpdateTicked with wall-clock gating; one-shot
          host writes belong on the OnSaveLoaded pre-seed path.
      - name: "E2E assertions via server HTTP API"
        mode: warning
        instructions: >-
          In tests/JunimoServer.Tests, flag test assertions about server state built on mod events
          or log parsing when a server HTTP API snapshot endpoint (/cabins, /players, /farmhands)
          exposes the same state — the API snapshot is the asserting surface.
      - name: "No refactor-history prose"
        mode: warning
        instructions: >-
          In code comments, docstrings, and docs (not commit messages or PR descriptions), flag
          prose describing how the code came to be rather than what it is: "previously",
          "no longer", "has been removed", "refactored from", or defensive framing of claims
          nobody questioned. The text must serve a cold reader.
      - name: "Testcontainers builders set Docker endpoint"
        mode: warning
        instructions: >-
          In tests/, flag any new Testcontainers builder chain (ContainerBuilder, NetworkBuilder,
          VolumeBuilder) that does not call WithDockerEndpoint(host.EndpointConfig) — the default
          named-pipe timeout fails under parallel startup load.

  tools:
    languagetool:
      enabled: false             # prose/grammar linter — too noisy across docs/; enable for docs proofreading
    github-checks:
      enabled: true
    eslint:
      enabled: true
    biome:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
  allow_non_org_members: true    # external contributors can interact with @coderabbitai on their PRs

knowledge_base:
  code_guidelines:
    enabled: false               # enforcement is curated in pre_merge_checks/path_instructions;
                                 # raw CLAUDE.md ingestion would add Claude-workflow noise
  learnings:
    scope: local                 # keep review learnings to this repo only
    approval_delay: 7            # veto window: learnings compound into future reviews, so each
                                 # gets a week for admin rejection before it auto-applies
