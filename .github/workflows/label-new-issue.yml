name: Label New Issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    name: Add needs-verification
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Add needs-verification label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit "$ISSUE_URL" --add-label needs-verification
