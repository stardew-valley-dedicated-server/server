name: Build Release

on:
  push:
    branches:
      - master

concurrency:
  group: build-release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Create Release PR
    # Skip in forks — release-please would otherwise open release PRs and tag releases there.
    # Every other job chains off this one via `needs`, so the guard cascades.
    if: github.repository == 'stardew-valley-dedicated-server/server'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    name: Build and Publish Docker Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # github.sha IS the tagged release commit here (release-please tags before this job
      # starts); full history + tags let the changelog resolve the previous release locally.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: sdvd/server
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-please.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            SDVD_GIT_SHA=${{ github.sha }}
          secrets: |
            steam_username=${{ secrets.STEAM_USERNAME }}
            steam_password=${{ secrets.STEAM_PASSWORD }}
            steam_refresh_token=${{ secrets.STEAM_REFRESH_TOKEN }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: sdvd/server
          readme-filepath: ./README.md

      - name: Build summary
        run: |
          echo "### Production Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.release-please.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`sdvd/server:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`sdvd/server:${{ needs.release-please.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull sdvd/server:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY

      # continue-on-error on both notification steps: a range or Discord failure must never
      # red a release build that already published its images.
      - name: Build changelog
        id: changelog
        continue-on-error: true
        uses: ./.github/actions/build-changelog
        with:
          head: ${{ needs.release-please.outputs.tag_name }}
          # Everything since the previous release — the stable stream carries a complete
          # changelog even when previews already announced parts of it.
          tag-match: sdvd-server-v*

      - name: Discord notification
        if: steps.changelog.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          # Bot name: try the channel-specific variable, then the shared one, then this default.
          # If no avatar variable is set, the action falls back to the project logo.
          username: ${{ vars.DISCORD_BOT_USERNAME_RELEASES || vars.DISCORD_BOT_USERNAME || 'Release Bot' }}
          avatar-url: ${{ vars.DISCORD_BOT_AVATAR_URL_RELEASES || vars.DISCORD_BOT_AVATAR_URL }}
          title: Release ${{ needs.release-please.outputs.version }}
          color: "5763719"
          description: |
            ${{ steps.changelog.outputs.markdown }}

            **Use it**
            ```IMAGE_VERSION=${{ needs.release-please.outputs.version }}```
            ```docker compose pull && docker compose up -d```

  stamp-issue-versions:
    name: Stamp Issue Versions
    needs: [release-please, build-and-publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp issues with release version
        uses: ./.github/actions/stamp-issue-versions
        with:
          # Org issue-field id for "Release version". Deleting and recreating a field
          # changes its id — this input must then be updated.
          field-id: "45984818"
          field-name: Release version
          value: ${{ needs.release-please.outputs.version }}
          channel: release
          head-ref: ${{ needs.release-please.outputs.tag_name }}
          tag-match: sdvd-server-v*

  build-and-publish-steam-service:
    name: Build Steam Service
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: sdvd/steam-service
      # Repo root, not ./tools/steam-service — the Dockerfile COPYs the repo-level
      # Directory.Build.props and .editorconfig (code-style enforcement).
      context: .
      dockerfile: ./tools/steam-service/Dockerfile
      version: ${{ needs.release-please.outputs.version }}
      additional_tag: latest
      cache_scope: steam-service
    secrets: inherit

  build-and-publish-discord-bot:
    name: Build Discord Bot
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: sdvd/discord-bot
      context: ./tools/discord-bot
      dockerfile: ./tools/discord-bot/Dockerfile
      version: ${{ needs.release-please.outputs.version }}
      additional_tag: latest
      cache_scope: discord-bot
    secrets: inherit

  build-docs:
    name: Build Latest Docs
    needs: build-and-publish
    permissions:
      contents: read
    uses: ./.github/workflows/build-docs.yml
    with:
      version: latest
      image_tag: latest
    secrets: inherit

  deploy-docs:
    name: Deploy Documentation
    needs: [build-docs, release-please]
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy-docs.yml
    with:
      latest_version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
