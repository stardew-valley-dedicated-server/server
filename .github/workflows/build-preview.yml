name: Build Preview

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

# Prevent multiple builds from running simultaneously
concurrency:
  group: build-preview
  cancel-in-progress: true

permissions: {}

jobs:
  # Push auto-builds only when the AUTO_BUILD_PREVIEW repo variable is 'true' (default off,
  # to avoid a throwaway preview per merge); a manual run always proceeds. calculate-version
  # depends on this, so a skipped gate cascades a skip to the whole workflow.
  gate:
    name: Check auto-preview enabled
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_BUILD_PREVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building preview (event=${{ github.event_name }})"

  calculate-version:
    name: Calculate Version
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
      preview_version: ${{ steps.version.outputs.preview_version }}
      preview_number: ${{ steps.version.outputs.preview_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for version calculation
          fetch-tags: true

      - name: Get next version from release-please PR
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Try to get version from release-please PR
          echo "Looking for release-please PR..."
          PR_TITLE=$(gh pr list --label "autorelease: pending" --json title --jq '.[0].title // empty')

          if [ -n "$PR_TITLE" ]; then
            echo "Found release-please PR: $PR_TITLE"
            # Extract version from PR title (e.g., "chore(master): release 1.4.0" or "chore: release 1.4.0")
            NEXT_VERSION=$(echo "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          fi

          # Fallback: if no PR or couldn't extract version, bump patch from current release
          if [ -z "$NEXT_VERSION" ]; then
            echo "No release-please PR found, bumping patch version"
            # Release tags are v<version>; those up to 1.4.1 carry an sdvd-server- prefix.
            # Strip both and pick the highest version, so neither prefix wins by name.
            CURRENT_VERSION=$(git tag -l 'v[0-9]*' 'sdvd-server-v*' | sed -E 's/^(sdvd-server-)?v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            echo "Latest release version: $CURRENT_VERSION"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "Next version: $NEXT_VERSION"

          # Highest existing preview build as "<version> <counter>". Preview tags are
          # v<version>-preview.<counter>; older builds carry preview-<version>.<counter>
          # (the [0-9] in that glob skips preview-steam-service-* and similar). Both forms
          # feed one sort so the counter continues across the tag-format change.
          PREVIEW_TAG=$({ git tag -l 'v[0-9]*-preview.[0-9]*' | sed -E 's/^v(.*)-preview\.([0-9]+)$/\1 \2/';
                          git tag -l 'preview-[0-9]*' | sed -E 's/^preview-(.*)\.([0-9]+)$/\1 \2/'; } \
                        | sort -k1,1V -k2,2n | tail -n 1)
          if [ -n "$PREVIEW_TAG" ]; then
            read -r PREVIEW_TAG_VERSION PREVIEW_TAG_COUNTER <<< "$PREVIEW_TAG"
            echo "Found preview build: version $PREVIEW_TAG_VERSION, counter $PREVIEW_TAG_COUNTER"

            if [ "$PREVIEW_TAG_VERSION" == "$NEXT_VERSION" ]; then
              # Same version, increment counter
              PREVIEW_NUMBER=$((PREVIEW_TAG_COUNTER + 1))
            else
              # Version changed, reset counter
              PREVIEW_NUMBER=1
            fi
          else
            # No preview tag exists yet
            PREVIEW_NUMBER=1
          fi
          echo "Preview number: $PREVIEW_NUMBER"

          # Create preview version
          PREVIEW_VERSION="$NEXT_VERSION-preview.$PREVIEW_NUMBER"
          echo "Preview version: $PREVIEW_VERSION"

          # Export variables
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "preview_version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT
          echo "preview_number=$PREVIEW_NUMBER" >> $GITHUB_OUTPUT

  build-server-preview:
    name: Build and Push Server Preview
    needs: calculate-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for the changelog range (previous build tag → this commit).
          fetch-depth: 0
          fetch-tags: true

      - name: Update version in files (for Docker build only)
        run: |
          PREVIEW_VERSION="${{ needs.calculate-version.outputs.preview_version }}"

          # Update manifest.json
          sed -i "s/\"Version\": \".*\"/\"Version\": \"$PREVIEW_VERSION\"/" mod/JunimoServer/manifest.json

          # Update csproj
          sed -i "s|<Version>.*</Version>|<Version>$PREVIEW_VERSION</Version>|g" mod/JunimoServer/JunimoServer.csproj

          echo "Updated files to version $PREVIEW_VERSION (not committed)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: sdvd/server
          tags: |
            type=raw,value=preview
            type=raw,value=${{ needs.calculate-version.outputs.preview_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            SDVD_GIT_SHA=${{ github.sha }}
          secrets: |
            steam_username=${{ secrets.STEAM_USERNAME }}
            steam_password=${{ secrets.STEAM_PASSWORD }}
            steam_refresh_token=${{ secrets.STEAM_REFRESH_TOKEN }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # Changelog + notification run BEFORE the tracking-tag push: with cancel-in-progress
      # concurrency, a cancellation between "tag pushed" and "post sent" would move the next
      # build's range past changes that were never announced. In this order a cancellation
      # loses nothing (the tag didn't move, the next build re-covers the range).
      # continue-on-error on both: notification machinery must never red a successful build
      # or block the tag push / downstream deploy.
      - name: Build changelog
        id: changelog
        continue-on-error: true
        uses: ./.github/actions/build-changelog
        with:
          head: ${{ github.sha }}
          # Everything since the previous build of either channel — same rule as issue stamping.
          tag-match: v[0-9]* sdvd-server-v* preview-[0-9]*

      - name: Discord notification
        if: steps.changelog.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PREVIEW }}
          # Bot name: try the channel-specific variable, then the shared one, then this default.
          # If no avatar variable is set, the action falls back to the project logo.
          username: ${{ vars.DISCORD_BOT_USERNAME_PREVIEW || vars.DISCORD_BOT_USERNAME || 'Preview Bot' }}
          avatar-url: ${{ vars.DISCORD_BOT_AVATAR_URL_PREVIEW || vars.DISCORD_BOT_AVATAR_URL }}
          title: Preview ${{ needs.calculate-version.outputs.preview_version }}
          color: "16753920"
          description: |
            ${{ steps.changelog.outputs.markdown }}

            ${{ steps.changelog.outputs.upgrade-notes }}**Update** (preview users only — `IMAGE_VERSION=preview`; on `latest`, wait for the release post)
            ```curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml && docker compose pull && docker compose up -d --remove-orphans```
            No `curl`? Download the file from the link, then `docker compose pull && docker compose up -d --remove-orphans`. Pin this build instead: `IMAGE_VERSION=${{ needs.calculate-version.outputs.preview_version }}`.

      - name: Update preview tracking tag
        env:
          PREVIEW_VERSION: ${{ needs.calculate-version.outputs.preview_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Tag is the image version with a v prefix: v<version>-preview.<counter>
          TRACKING_TAG="v${PREVIEW_VERSION}"
          git tag -f "$TRACKING_TAG"
          git push origin "$TRACKING_TAG" --force

      - name: Build summary
        run: |
          echo "### Preview Build Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.calculate-version.outputs.preview_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Next Release:** \`${{ needs.calculate-version.outputs.next_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`sdvd/server:preview\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`sdvd/server:${{ needs.calculate-version.outputs.preview_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull sdvd/server:preview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  stamp-issue-versions:
    name: Stamp Issue Versions
    needs: [calculate-version, build-server-preview]
    # Deploy Server auto-deploys via workflow_run only when this workflow's conclusion is
    # success, so a stamping failure must not fail the run — it still shows as a red job
    # with an annotation, and the next preview build retries (stamping is idempotent).
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp issues with preview version
        uses: ./.github/actions/stamp-issue-versions
        with:
          # Org issue-field id for "Preview version". Deleting and recreating a field
          # changes its id — this input must then be updated.
          field-id: "45970008"
          field-name: Preview version
          value: ${{ needs.calculate-version.outputs.preview_version }}
          channel: preview
          head-ref: ${{ github.sha }}
          # Base = the nearest earlier build of either channel on a previous commit (the action
          # ignores tags on this commit itself, including this run's own tracking tag).
          tag-match: v[0-9]* sdvd-server-v* preview-[0-9]*

  build-steam-service-preview:
    name: Build Steam Service Preview
    needs: calculate-version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: sdvd/steam-service
      # Repo root, not ./tools/steam-service — the Dockerfile COPYs the repo-level
      # Directory.Build.props and .editorconfig (code-style enforcement).
      context: .
      dockerfile: ./tools/steam-service/Dockerfile
      version: ${{ needs.calculate-version.outputs.preview_version }}
      additional_tag: preview
      cache_scope: steam-service
    secrets: inherit

  build-discord-bot-preview:
    name: Build Discord Bot Preview
    needs: calculate-version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: sdvd/discord-bot
      context: ./tools/discord-bot
      dockerfile: ./tools/discord-bot/Dockerfile
      version: ${{ needs.calculate-version.outputs.preview_version }}
      additional_tag: preview
      cache_scope: discord-bot
    secrets: inherit

  build-docs:
    name: Build Preview Docs
    needs: build-server-preview
    permissions:
      contents: read
    uses: ./.github/workflows/build-docs.yml
    with:
      version: preview
      image_tag: preview
    secrets: inherit

  deploy-docs:
    name: Deploy Documentation
    needs: [build-docs, calculate-version]
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy-docs.yml
    with:
      preview_version: ${{ needs.calculate-version.outputs.preview_version }}
    secrets: inherit
