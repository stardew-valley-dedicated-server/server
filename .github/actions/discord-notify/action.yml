name: Discord Notify
description: >
  Posts a message to a Discord webhook: a primary embed, an optional second embed, an optional
  plain content line above them, and an optional row of link buttons. It checks Discord's size
  limits first and fails the step with a clear message rather than posting something cut off. If
  the webhook input is empty it just logs a note and exits 0, so notifications quietly stop when
  the secret isn't set. If the post itself fails the step fails (curl --fail-with-body); callers on
  the success path set continue-on-error, so a Discord outage never turns a passing build red.

inputs:
  webhook:
    description: Discord webhook URL; empty means log "no webhook configured" and skip
    required: true
  content:
    description: Optional plain message line shown above the embeds (at most 2000 characters)
    required: false
    default: ""
  title:
    description: Optional primary embed title (at most 256 characters); omit it and put the
      heading in the description instead. Either a title or a description must be set.
    required: false
    default: ""
  url:
    description: Optional URL the title links to
    required: false
    default: ""
  username:
    description: >
      The name shown as the message author. Leave empty to keep whatever name the webhook is set
      to in Discord — so callers that don't set a name (internal CI) are left alone.
    required: false
    default: ""
  avatar-url:
    description: >
      The avatar shown next to the name. If empty, we use the project logo, but only when a name is
      also set — so the release/preview bot gets a picture while other callers keep their own avatar.
    required: false
    default: ""
  color:
    description: Embed color as a decimal number
    required: true
  description:
    description: Optional primary-embed description, markdown (at most 4096 characters)
    required: false
    default: ""
  fields:
    description: >
      Optional JSON array of {name, value, inline?} objects. Callers build it with
      `jq -n --arg` so user-supplied text is never string-interpolated into JSON.
    required: false
    default: "[]"
  embed2-title:
    description: Optional second-embed title; the second embed is added only if this or its
      description is set (at most 256 characters)
    required: false
    default: ""
  embed2-description:
    description: Optional second-embed description, markdown (at most 4096 characters)
    required: false
    default: ""
  buttons:
    description: >
      Optional JSON array of {label, url} link buttons rendered in one row below the embeds
      (max 5). Author-controlled values only. When present, `?with_components=true` is added to the
      webhook URL so Discord renders them.
    required: false
    default: "[]"
  dry-run:
    description: Print the payload instead of posting (used by payload tests)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build and post embed
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        CONTENT: ${{ inputs.content }}
        TITLE: ${{ inputs.title }}
        URL: ${{ inputs.url }}
        USERNAME: ${{ inputs.username }}
        AVATAR_URL: ${{ inputs.avatar-url }}
        COLOR: ${{ inputs.color }}
        DESCRIPTION: ${{ inputs.description }}
        FIELDS: ${{ inputs.fields }}
        EMBED2_TITLE: ${{ inputs.embed2-title }}
        EMBED2_DESCRIPTION: ${{ inputs.embed2-description }}
        BUTTONS: ${{ inputs.buttons }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        if [ "$DRY_RUN" != "true" ] && [ -z "$WEBHOOK" ]; then
          echo "No webhook configured, skipping Discord notification."
          exit 0
        fi

        [[ "$COLOR" =~ ^[0-9]+$ ]] || { echo "::error::discord-notify: color must be decimal, got '$COLOR'"; exit 1; }
        [ -n "$TITLE" ] || [ -n "$DESCRIPTION" ] \
          || { echo "::error::discord-notify: a title or a description must be set"; exit 1; }
        jq -e 'type == "array" and all(.[]; (.name | type == "string") and (.value | type == "string"))' \
          >/dev/null 2>&1 <<< "$FIELDS" \
          || { echo "::error::discord-notify: fields must be a JSON array of {name, value} objects"; exit 1; }
        jq -e 'type == "array" and all(.[]; (.label | type == "string") and (.url | type == "string"))' \
          >/dev/null 2>&1 <<< "$BUTTONS" \
          || { echo "::error::discord-notify: buttons must be a JSON array of {label, url} objects"; exit 1; }

        # If a caller sets a name (release/preview) but no avatar, fall back to the project logo.
        # This is the one place that URL lives; it's served from the docs site. Callers with no name
        # (internal CI) are left alone and keep the avatar their webhook is configured with.
        if [ -n "$USERNAME" ] && [ -z "$AVATAR_URL" ]; then
          AVATAR_URL="https://docs.junimoserver.com/logo.png"
        fi

        payload=$(jq -cn \
          --arg content "$CONTENT" \
          --arg title "$TITLE" \
          --arg url "$URL" \
          --arg desc "$DESCRIPTION" \
          --arg e2title "$EMBED2_TITLE" \
          --arg e2desc "$EMBED2_DESCRIPTION" \
          --arg username "$USERNAME" \
          --arg avatar "$AVATAR_URL" \
          --argjson color "$COLOR" \
          --argjson fields "$FIELDS" \
          --argjson buttons "$BUTTONS" \
          '(
            {color: $color}
            + (if $title == "" then {} else {title: $title} end)
            + (if $url == "" then {} else {url: $url} end)
            + (if $desc == "" then {} else {description: $desc} end)
            + (if ($fields | length) == 0 then {} else {fields: $fields} end)
          ) as $primary
          # Second embed shares the primary color so both left bars match; added only when set.
          | (if $e2title == "" and $e2desc == "" then [] else [(
              {color: $color}
              + (if $e2title == "" then {} else {title: $e2title} end)
              + (if $e2desc == "" then {} else {description: $e2desc} end)
            )] end) as $extra
          | {embeds: ([$primary] + $extra)}
          + (if $content == "" then {} else {content: $content} end)
          + (if $username == "" then {} else {username: $username} end)
          + (if $avatar == "" then {} else {avatar_url: $avatar} end)
          + (if ($buttons | length) == 0 then {} else
              {components: [{type: 1, components: [$buttons[] | {type: 2, style: 5, label: .label, url: .url}]}]}
            end)')

        # Discord limits, checked across every embed: content 2000; per embed title 256,
        # description 4096, field name 256 / value 1024, 25 fields; 6000 characters summed over all
        # embeds; one button row of at most 5, each label 1-80. We fail loudly rather than trim: a
        # cut-off message is worse than a red step, and the changelog builder keeps itself in budget.
        errors=$(jq -r '
          (.content // "") as $content
          | .embeds as $embeds
          | (.components // []) as $rows
          | ([$embeds[] | (.title | length) + ((.description // "") | length)
                + ([(.fields // [])[] | (.name | length) + (.value | length)] | add // 0)] | add // 0) as $total
          | [
              (select(($content | length) > 2000) | "content exceeds 2000 characters"),
              ($embeds[] | select((.title | length) > 256) | "an embed title exceeds 256 characters"),
              ($embeds[] | select(((.description // "") | length) > 4096) | "an embed description exceeds 4096 characters"),
              ($embeds[] | select(((.fields // []) | length) > 25) | "an embed has more than 25 fields"),
              ($embeds[] | (.fields // [])[] | select((.name | length) < 1 or (.name | length) > 256)
                | "a field name is empty or over 256 characters"),
              ($embeds[] | (.fields // [])[] | select((.value | length) < 1 or (.value | length) > 1024)
                | "a field value is empty or over 1024 characters (field: \(.name))"),
              (select($total > 6000) | "embeds exceed 6000 characters total"),
              ($rows[] | select((.components | length) > 5) | "a button row has more than 5 buttons"),
              ($rows[] | .components[] | select((.label | length) < 1 or (.label | length) > 80)
                | "a button label is empty or over 80 characters")
            ]
          | unique | join("; ")' <<< "$payload")
        if [ -n "$errors" ]; then
          echo "::error::discord-notify: message over Discord limits: $errors"
          exit 1
        fi

        if [ "$DRY_RUN" = "true" ]; then
          echo "$payload"
          exit 0
        fi

        # Link buttons render only when the webhook request opts in via ?with_components=true.
        post_url="$WEBHOOK"
        if [ "$(jq 'length' <<< "$BUTTONS")" -gt 0 ]; then
          case "$WEBHOOK" in
            *\?*) post_url="${WEBHOOK}&with_components=true" ;;
            *)    post_url="${WEBHOOK}?with_components=true" ;;
          esac
        fi
        curl -sS --fail-with-body --proto '=https' -H "Content-Type: application/json" -d "$payload" "$post_url"
